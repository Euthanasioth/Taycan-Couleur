
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Vérifier le manifeste XML
        run: |
          echo "=== CONTENU DU MANIFESTE ==="
          cat -n app/src/main/AndroidManifest.xml

          echo "=== VALIDATION XML ==="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALIDE')"

          echo "=== BUILD ==="
          ./gradlew :app:processDebugMainManifest --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taycan-couleur-apk
          path: app/build/outputs/apk/debug/app-debug.apk
